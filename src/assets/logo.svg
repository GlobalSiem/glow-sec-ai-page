<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="gGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff8a1e"/>
      <stop offset="100%" stop-color="#ff5a00"/>
    </linearGradient>
    <linearGradient id="sGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5ee7ff"/>
      <stop offset="100%" stop-color="#22b8d9"/>
    </linearGradient>
    <filter id="glowO" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowC" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- G outside -->
  <g filter="url(#glowO)">
    <path d="M50 8
             a42 42 0 1 0 42 42
             h-22
             a20 20 0 1 1 -20 -20"
          stroke="url(#gGrad)" stroke-width="8" stroke-linecap="round" fill="none"/>
  </g>
  <!-- S inside -->
  <g filter="url(#glowC)" transform="translate(50 50)">
    <path d="M-9 -12
             c 14 0 14 10 0 10
             c -14 0 -14 10 0 10"
          stroke="url(#sGrad)" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>
</svg>
